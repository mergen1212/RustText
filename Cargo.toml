[package]
name = "rusttext"
version = "0.1.4"
edition = "2024"

[dependencies]
gpui-kit = { version = "=0.10.0", features = ["syntect"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
crc32fast = "1"
tempfile = "3"
semver = "1"
sha2 = "0.11"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls", "json"] }
zip = { version = "6", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
debug = 0                    
opt-level = 1               
incremental = true
codegen-units = 256         
strip = "debuginfo"          

[profile.dev.package."*"]
opt-level = 3
debug = false
codegen-units = 16


[profile.release]
opt-level = 3               
lto = "fat"                  
codegen-units = 1            
panic = "abort"             
strip = "symbols"            
debug = false
incremental = false
debug-assertions = false
overflow-checks = false


[profile.release.package."*"]
opt-level = 3
codegen-units = 1


[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"


[profile.bench]
inherits = "release"
debug = true                
strip = "none"
